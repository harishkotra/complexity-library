[project]
name = "complexity-library-api"
version = "0.1.0"
description = "Deterministic complexity analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "supabase>=2.20,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
